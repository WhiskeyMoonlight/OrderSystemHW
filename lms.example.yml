# Ключи LMS для сборки чекера.
# Скопируйте этот файл в lms.yml (он в .gitignore и в git не попадёт) и впишите значения.
#
# Обычно в lms.yml держат только токен компании — он общий для всех заданий,
# а ID задания передают при сборке: ./build.sh --tests ... --task-id 123
# Аргументы и переменные окружения всегда важнее значений из файла.

# Токен компании в LMS (Metaclass). Выдаёт владелец курса.
lms_token: PASTE_COMPANY_TOKEN_HERE

# ID задания в LMS. У каждого задания свой.
task_id: PASTE_TASK_ID_HERE
